info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: localhost:3000/auth/register
  body:
    type: json
    data: |-
      {
        "userlogin": "admin",
        "username": "Admin 1",
        "password": "password",
        "email": "admin@admin.com",
        "groupId": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

